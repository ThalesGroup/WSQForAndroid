plugins {
    id "com.vanniktech.maven.publish" version "0.37.0" apply(true)
}
apply plugin: 'com.android.library'

android {
    compileSdkVersion 37
    namespace 'com.gemalto.wsq'
    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 37
        versionName "1.2.1"
        versionCode 3
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    ndkVersion = '23.2.8568313'
    enableKotlin = false
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}

/*************************************************************/
/******************* PUBLISHING STUFF ************************/
/*************************************************************/
mavenPublishing {
    publishToMavenCentral()
    signAllPublications()
    coordinates("io.github.michaldvorak-gemalto", "wsq-android", "${android.defaultConfig.versionName}")

    pom {
        name = "WSQForAndroid"
        description = "A WSQ image encoder/decoder for Android"
        inceptionYear = "2019"
        url = "https://github.com/ThalesGroup/WSQForAndroid"
        licenses {
            license {
                name = "The 2-Clause BSD License"
                url = "https://opensource.org/licenses/BSD-2-Clause"
                distribution = "repo"
            }
        }
        developers {
            developer {
                name = "Michal Dvorak"
                url = "https://github.com/michaldvorak-gemalto"
            }
        }
        scm {
            url = "https://github.com/ThalesGroup/WSQForAndroid"
            connection = "scm:git:https://github.com/ThalesGroup/WSQForAndroid.git"
        }
    }
}
